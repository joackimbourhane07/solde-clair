# Publie SoldeClair sur GitHub Pages à chaque mise à jour de la branche main.
# Uniquement des actions officielles GitHub. Aucun secret ni service externe n'est utilisé.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Construire le site
        run: npm run build
        env:
          BASE_PATH: /solde-clair/

      - name: Page 404 de secours
        # Les adresses utilisent « # » : une actualisation ne donne jamais d'erreur 404.
        # Cette copie renvoie quand même vers l'application si une ancienne adresse est ouverte.
        run: cp dist/index.html dist/404.html

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
